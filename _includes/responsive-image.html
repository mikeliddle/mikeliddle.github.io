{% assign image_src = include.src | relative_url %}
{% assign image_stem = image_src | remove: ".jpg" | remove: ".jpeg" | remove: ".png" %}
<picture>
    <source type="image/avif"
        srcset="{{ image_stem }}-640.avif 640w, {{ image_stem }}-1200.avif 1200w, {{ image_stem }}-1800.avif 1800w"
        sizes="(min-width: 1200px) 825px, (min-width: 768px) 75vw, 100vw">
    <source type="image/webp"
        srcset="{{ image_stem }}-640.webp 640w, {{ image_stem }}-1200.webp 1200w, {{ image_stem }}-1800.webp 1800w"
        sizes="(min-width: 1200px) 825px, (min-width: 768px) 75vw, 100vw">
    <img src="{{ image_stem }}-1800.jpg" alt="{{ include.alt | escape }}" width="{{ include.width }}"
        height="{{ include.height }}" loading="lazy" decoding="async">
</picture>
